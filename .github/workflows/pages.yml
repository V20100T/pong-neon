name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Seul le jeu web est publié (pas l'exécutable ni les sources Scratch / Go)
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html style.css game.js _site/
          # Numéro de version dans les liens : les navigateurs rechargent le jeu après chaque mise à jour
          sed -i "s/\(game\.js\|style\.css\)\"/\1?v=${GITHUB_SHA::7}\"/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
